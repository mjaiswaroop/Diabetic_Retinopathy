name: CI Clinical Safety & Workstation Regression Gate

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  frontend-verification:
    name: Frontend TypeScript & Production Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: TypeScript Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Next.js Production Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  backend-clinical-safety:
    name: Backend PyTorch Inference & Safety Regression Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Start PyTorch Inference Server
        run: |
          python backend/direct_server.py &
          echo "Waiting for backend health endpoint..."
          timeout 60 bash -c 'until curl -s http://127.0.0.1:8000/health | grep -q "\"status\":\"ok\""; do sleep 2; done'
          echo "FastAPI Server Ready on port 8000"

      - name: Run Clinical Safety Regression Suite
        run: |
          python -m unittest ml/test_ci_safety.py

